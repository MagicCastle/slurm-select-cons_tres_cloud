name: compile cons_tres_cloud
on: [push]
jobs:
    Compile:
        runs-on: ubuntu-latest
        steps:
            - run: sudo apt install libmunge-dev
            - uses: actions/checkout@v6
              with:
                sparse-checkout: |
                    src
            - run: curl -L -O https://download.schedmd.com/slurm/slurm-24.11.7.tar.bz2
            - run: tar xvf slurm-24.11.7.tar.bz2
            - run: mv slurm*/ slurm/
            - run: |
                cd slurm
                git checkout slurm-24-11-7-1
                cp ../src/job_test.c src/plugins/select/cons_tres/
                ./configure
                cd slurm/src/plugins/select/cons_tres/
                make
                cp .libs/select_cons_tres.so ~/